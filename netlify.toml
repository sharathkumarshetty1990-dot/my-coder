[build]
  command = "npm install && npm run build --workspace=@opencode-ai/app"
  publish = "packages/app/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev --workspace=@opencode-ai/app"
  port = 3000
  targetPort = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm install && npm run build --workspace=@opencode-ai/app"

[context.deploy-preview]
  command = "npm install && npm run build --workspace=@opencode-ai/app"

[context.branch-deploy]
  command = "npm install && npm run build --workspace=@opencode-ai/app"
